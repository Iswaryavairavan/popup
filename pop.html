<!DOCTYPE html>
<html>

<head>
    <title>POPUP Page</title>
</head>

<body>
    <center>
        <h1 id="one">WELCOME</h1>
        <p id="two">
            Click the button to open the popup page
        </p>
        <button id="three" onclick="pop()">Click Me!</button>
       <br><br>
    </center>
    <center>
    <div id="popup">
        <h1>Enter your details</h1>
        Name: <input type="text" id="name" placeholder="Enter your name">
        <br><br>
        Date of Birth: <input type="date" id="dob" >
        <br><br>
        Gender:
        <input type="radio" name="gender" value="Male">Male
        <input type="radio" name="gender" value="Female">Female
        <br><br>
        Mobile number:<input type="number" id="mobile" placeholder="Enter your mobile number">
        <br><br>
        Email id:<input type="email" id="email" placeholder="Enter your email id">
        <br><br>
        <button onclick="submitform()">Submit</button>
    </div>
    <div id="details"></div>
    </center>
</body>

</html>
<style>
    body {
        background-color: rgb(212, 187, 244);
    }

    h1 {
        color: rgb(206, 89, 16);
    }

    p {
        font-size: 18px;
    }

    #three {
        background-color: blue;
        color: white;
        cursor: pointer;
    }
   #popup{
    display:none;
    background-color: rgb(176, 139, 198);
    padding: 20px;
    width: 500px;
    margin: 20px auto;
    }
   
</style>
<script>
    var first = document.getElementById("one")
    var second = document.getElementById("two")
    var third = document.getElementById("three")
    var closepop=document.getElementById("close")
    function pop() {
        document.getElementById("popup").style.display = "block";
    }
        function submitform(){
            var name = document.getElementById("name").value
    var date = document.getElementById("dob").value
   var gender = document.querySelector('input[name="gender"]:checked').value;
    var mobile=document.getElementById("mobile").value
    var email=document.getElementById("email").value
    document.getElementById("details").innerHTML=
        "Name: " + name + "<br>" +
        "Date of Birth: " + date + "<br>" +
        "Gender: " + gender + "<br>" +
        "Mobile Number: " + mobile + "<br>" +
        "Email: " + email;
     document.getElementById("popup").style.display = "none";
        }
    

</script>
